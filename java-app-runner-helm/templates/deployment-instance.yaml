{{- if .Values.instances }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "java-app-runner.fullname" . }}
  labels:
    {{- include "java-app-runner.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.hostNetwork }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "java-app-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "java-app-runner.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      initContainers:
      # Setup dependencies
      - name: setup-dependencies
        image: alpine:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        args:
          - -c
          - |
            set -e
            apk add --no-cache git wget unzip curl bash
            echo "Dependencies installed successfully"
        volumeMounts:
        - name: app-data
          mountPath: /app/java-app-runner

      # Download Application (shared across all instances)
      {{- if ne .Values.app.download.type "None" }}
      - name: download-app
        image: alpine:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        args:
          - -c
          - |
            set -e
            apk add --no-cache git git-lfs wget unzip curl bash
            cd /app/java-app-runner

            {{- if eq .Values.app.download.type "GitRepo" }}
            # Git Repository Download
            if [ ! -d .git ]; then
              echo "Cloning Git repository..."
              {{- if .Values.app.download.git.password }}
              {{- if .Values.app.download.git.username }}
              DOWNLOAD_URL="{{ .Values.app.download.source }}"
              DOWNLOAD_URL="${DOWNLOAD_URL/https:\/\//https://{{ .Values.app.download.git.username }}:{{ .Values.app.download.git.password }}@}"
              {{- else }}
              DOWNLOAD_URL="{{ .Values.app.download.source }}"
              DOWNLOAD_URL="${DOWNLOAD_URL/https:\/\//https://{{ .Values.app.download.git.password }}@}"
              {{- end }}
              {{- else }}
              DOWNLOAD_URL="{{ .Values.app.download.source }}"
              {{- end }}

              # Initialize Git LFS
              git lfs install

              {{- if .Values.app.download.git.branch }}
              # Clone specific branch
              git clone -b {{ .Values.app.download.git.branch }} "$DOWNLOAD_URL" srv
              {{- else }}
              # Clone default branch
              git clone "$DOWNLOAD_URL" srv
              {{- end }}

              cd srv

              # Pull LFS files
              git lfs pull

              cd ..
              cp -r srv/. ./
              rm -rf srv
              echo "Git repository cloned successfully (with LFS files)"
            else
              echo "Git repository already exists, pulling latest changes..."
              git lfs install

              {{- if .Values.app.download.git.branch }}
              # Checkout specified branch
              git fetch origin
              git checkout {{ .Values.app.download.git.branch }} --force
              git pull origin {{ .Values.app.download.git.branch }}
              {{- else }}
              # Pull default branch
              git pull
              {{- end }}

              git lfs pull
            fi
            {{- else if eq .Values.app.download.type "GithubRelease" }}
            # GitHub Release Download
            echo "Downloading from GitHub release..."
            {{- if .Values.app.download.github.version }}
            RELEASE_URL="https://github.com/{{ .Values.app.download.source }}/releases/download/{{ .Values.app.download.github.version }}/{{ .Values.app.download.github.filename }}"
            {{- else }}
            RELEASE_URL="https://github.com/{{ .Values.app.download.source }}/releases/latest/download/{{ .Values.app.download.github.filename }}"
            {{- end }}

            wget -O app-download.zip "$RELEASE_URL"
            unzip -o app-download.zip
            rm -f app-download.zip
            echo "GitHub release downloaded successfully"
            {{- else if eq .Values.app.download.type "DownloadURL" }}
            # Direct URL Download
            echo "Downloading from URL..."
            wget -O app-download.zip "{{ .Values.app.download.source }}"
            unzip -o app-download.zip
            rm -f app-download.zip
            echo "Application downloaded successfully"
            {{- end }}
        volumeMounts:
        - name: app-data
          mountPath: /app/java-app-runner
      {{- end }}

      # Create instance directories and copy files
      - name: setup-instances
        image: alpine:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        args:
          - -c
          - |
            set -e
            apk add --no-cache unzip

            cd /app/java-app-runner
            echo "Base directory contents:"
            ls -la

            {{- range $instance := .Values.instances }}
            echo "Setting up instance directory for {{ $instance.name }}..."
            mkdir -p instance-{{ $instance.name }}

            # Copy all files from base directory to instance directory
            echo "Copying files to instance-{{ $instance.name }}..."
            for item in *; do
              case "$item" in
                instance-*)
                  echo "  Skipping $item"
                  ;;
                *)
                  if [ -e "$item" ]; then
                    echo "  Copying $item"
                    cp -r "$item" "instance-{{ $instance.name }}/"
                  fi
                  ;;
              esac
            done

            # Copy hidden files
            for item in .[!.]* ..?*; do
              if [ -e "$item" ]; then
                echo "  Copying hidden $item"
                cp -r "$item" "instance-{{ $instance.name }}/" 2>/dev/null || true
              fi
            done

            {{- if and $instance.app $instance.app.templateFiles }}
            # Extract instance-specific templates (overrides global)
            cd /app/java-app-runner/instance-{{ $instance.name }}{{ if $.Values.app.appDir }}/{{ $.Values.app.appDir }}{{ end }}
            {{- range $index, $template := $instance.app.templateFiles }}
            echo "Extracting instance template {{ $index }} to {{ $template.extractTo }} for {{ $instance.name }}..."
            if [ -f "/templates/{{ $instance.name }}-{{ $index }}.zip" ]; then
              unzip -o "/templates/{{ $instance.name }}-{{ $index }}.zip" -d "{{ $template.extractTo }}"
              echo "  Template extracted"
            else
              echo "  Error: Instance template file not found"
              exit 1
            fi
            {{- end }}
            cd /app/java-app-runner
            {{- else if $.Values.app.templateFiles }}
            # Extract global templates
            cd /app/java-app-runner/instance-{{ $instance.name }}{{ if $.Values.app.appDir }}/{{ $.Values.app.appDir }}{{ end }}
            {{- range $index, $template := $.Values.app.templateFiles }}
            echo "Extracting global template {{ $index }} to {{ $template.extractTo }} for {{ $instance.name }}..."
            if [ -f "/templates/global-{{ $index }}.zip" ]; then
              unzip -o "/templates/global-{{ $index }}.zip" -d "{{ $template.extractTo }}"
              echo "  Template extracted"
            else
              echo "  Error: Global template file not found"
              exit 1
            fi
            {{- end }}
            cd /app/java-app-runner
            {{- end }}

            echo "Instance {{ $instance.name }} setup complete"
            echo "Contents of instance-{{ $instance.name }}:"
            ls -la instance-{{ $instance.name }}
            {{- end }}

            echo "All instances setup complete"
        volumeMounts:
        - name: app-data
          mountPath: /app/java-app-runner
        {{- if .Values.app.templateFiles }}
        {{- range $index, $template := .Values.app.templateFiles }}
        - name: template-global-{{ $index }}
          mountPath: /templates/global-{{ $index }}.zip
        {{- end }}
        {{- end }}
        {{- range $instance := .Values.instances }}
        {{- if and $instance.app $instance.app.templateFiles }}
        {{- range $index, $template := $instance.app.templateFiles }}
        - name: template-{{ $instance.name }}-{{ $index }}
          mountPath: /templates/{{ $instance.name }}-{{ $index }}.zip
        {{- end }}
        {{- end }}
        {{- end }}



      containers:
      {{- range $instanceIndex, $instance := .Values.instances }}
      {{- $mergedService := merge (deepCopy ($instance.service | default dict)) $.Values.service }}
      {{- $mergedApp := merge (deepCopy ($instance.app | default dict)) $.Values.app }}
      {{- $mergedResources := merge (deepCopy ($instance.resources | default dict)) $.Values.resources }}
      {{- $mergedEnv := $instance.env | default list }}
      - name: {{ $instance.name }}
        image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        workingDir: /app/java-app-runner/instance-{{ $instance.name }}{{ if $mergedApp.appDir }}/{{ $mergedApp.appDir }}{{ end }}
        stdin: true
        tty: true
        command: ["/bin/sh"]
        args:
          - -c
          - |
            # Install sed for config replacements
            apk add --no-cache sed

            cd /app/java-app-runner/instance-{{ $instance.name }}{{ if $mergedApp.appDir }}/{{ $mergedApp.appDir }}{{ end }}

            echo "Current directory: $(pwd)"
            echo "Directory contents:"
            ls -la

            {{- $baseReplacements := $.Values.app.configReplacements | default dict }}
            {{- $instanceReplacements := $instance.app.configReplacements | default dict }}
            {{- if or $baseReplacements $instanceReplacements }}
            # Apply configuration replacements
            echo "Applying configuration replacements for {{ $instance.name }}..."
            {{- $allReplacements := dict }}
            {{- range $file, $replacements := $baseReplacements }}
              {{- $_ := set $allReplacements $file $replacements }}
            {{- end }}
            {{- range $file, $replacements := $instanceReplacements }}
              {{- if hasKey $allReplacements $file }}
                {{- $_ := set $allReplacements $file (merge $replacements (index $allReplacements $file)) }}
              {{- else }}
                {{- $_ := set $allReplacements $file $replacements }}
              {{- end }}
            {{- end }}
            {{- range $filePath, $replacements := $allReplacements }}
            if [ -f "{{ $filePath }}" ]; then
              echo "Processing file: {{ $filePath }}"
              {{- range $search, $replace := $replacements }}
              sed -i 's|{{ $search }}|{{ $replace }}|g' "{{ $filePath }}"
              {{- end }}
            else
              echo "Warning: File not found: {{ $filePath }}"
            fi
            {{- end }}
            echo "Configuration replacements applied"
            {{- end }}

            # Use exec to replace shell with Java, making Java PID 1
            exec java {{ $mergedApp.java.args }} -jar {{ $mergedApp.jarName }} {{ $mergedApp.jarOptions }}
        ports:
        - name: {{ $instance.name | trunc 15 | trimSuffix "-" }}
          containerPort: {{ $mergedService.port }}
          protocol: {{ $mergedService.protocol }}
        env:
        {{- if $.Values.hostNetwork }}
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        {{- end }}
        {{- if $mergedEnv }}
        {{- toYaml $mergedEnv | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml $mergedResources | nindent 10 }}
        volumeMounts:
        - name: app-data
          mountPath: /app/java-app-runner
      {{- end }}
      {{- if and .Values.debug .Values.debug.enabled }}
      # Debug sidecar container for shell access
      - name: debug
        image: alpine:latest
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "Debug sidecar started. You can exec into this container for debugging."
            tail -f /dev/null
        volumeMounts:
        - name: app-data
          mountPath: /app/java-app-runner
      {{- end }}
      volumes:
      - name: app-data
        {{- if and .Values.persistence .Values.persistence.enabled }}
        {{- if eq .Values.persistence.type "hostPath" }}
        hostPath:
          path: {{ .Values.persistence.hostPath }}
          type: DirectoryOrCreate
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "java-app-runner.fullname" . }}
        {{- end }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if .Values.app.templateFiles }}
      {{- range $index, $template := .Values.app.templateFiles }}
      - name: template-global-{{ $index }}
        hostPath:
          path: {{ $template.hostPath }}
          type: File
      {{- end }}
      {{- end }}
      {{- range $instance := .Values.instances }}
      {{- if and $instance.app $instance.app.templateFiles }}
      {{- range $index, $template := $instance.app.templateFiles }}
      - name: template-{{ $instance.name }}-{{ $index }}
        hostPath:
          path: {{ $template.hostPath }}
          type: File
      {{- end }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
