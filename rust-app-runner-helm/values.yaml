# Default values for rust-app-runner
replicaCount: 1

# Network configuration
hostNetwork: true  # Use host network for direct port exposure

# Debug sidecar (optional)
debug:
  enabled: false  # Set to true to add a debug sidecar container with shell access

image:
  repository: rust
  tag: alpine
  pullPolicy: IfNotPresent

# Rust application configuration
app:
  # Download configuration
  download:
    type: ""  # Options: DownloadURL, GithubRelease, GitRepo, None
    source: ""  # Git repo URL, GitHub User/Repo, or Download URL
    
    # Git repo specific settings
    git:
      branch: ""
      username: ""
      password: ""
    
    # GitHub release specific settings
    github:
      filename: ""
      version: ""  # Empty = latest
  
  # Rust configuration
  rust:
    buildRelease: true  # Use release mode (--release) for both cargo build and cargo run
    buildArgs: ""  # Additional cargo arguments (applied to both build and run, e.g. "-p api")
    # Extra Alpine packages installed via `apk add --no-cache` in both the build
    # and runtime containers before cargo is invoked. Typical sets:
    #   crates using openssl-sys (reqwest, sqlx with tls, etc.):
    #     ["pkgconfig", "openssl-dev", "musl-dev"]
    #   crates needing a C toolchain:
    #     ["build-base"]
    systemDeps: []
    # When set, CARGO_HOME is exported in both build and runtime containers.
    # Putting it inside the persisted volume (default mount /app/rust-app-runner)
    # means the crates.io registry, downloaded .crate tarballs, and git-based
    # deps survive pod restarts and helm upgrades, so subsequent builds skip
    # downloads entirely. Leave empty to fall back to the image default
    # (/usr/local/cargo in rust:alpine), which is ephemeral.
    cargoHome: "/app/rust-app-runner/.cargo"
    # Extra cargo binaries to `cargo install` before `cargo build` runs. Each
    # entry is appended verbatim to `cargo install`, so flags can be included
    # inline, e.g. "sqlx-cli --no-default-features --features rustls,postgres".
    # Binaries are placed in $CARGO_HOME/bin, which is prepended to PATH in
    # both the build and runtime containers so tools like sqlx-cli are usable
    # at runtime (e.g. for migrations). When cargoHome points inside the
    # persisted volume, installs survive pod restarts.
    cargoInstall: []

  # Application settings
  # The app is launched with: cargo run [--release] [buildArgs] [--bin binaryName] [-- binaryArgs]
  binaryName: ""  # Passed as `--bin <name>` to cargo run (leave empty if the crate has a single bin)
  binaryArgs: ""  # Arguments passed to the binary (after `--`)
  appDir: ""  # Subdirectory under root where app is installed
  
  # Configuration replacements - replaces tokens in ALL files after download
  # Format: key-value pairs where key is the token to find and value is the replacement
  # Tokens can be in any format you want (e.g., {{TOKEN}}, ${TOKEN}, %TOKEN%, etc.)
  configReplacements: {}
    # Example:
    # "{{SERVER_NAME}}": "My Server"
    # "{{SERVER_PORT}}": "8080"
    # "{{MAX_CONNECTIONS}}": "100"

# Service configuration
service:
  type: ClusterIP
  port: 8080
  protocol: TCP  # Options: TCP, UDP, Both

# Resource limits
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Persistence (optional - if not specified, uses emptyDir which loses data on pod restart)
# persistence:
#   enabled: true
#   type: "pvc"  # Options: "pvc" or "hostPath"
#   storageClass: ""
#   accessMode: ReadWriteOnce
#   size: 10Gi
#   mountPath: /app/rust-app-runner
#   hostPath: ""  # Only used when type is "hostPath", e.g., /Users/username/app/rust-app-runner

# Database configuration
# Injected as DATABASE_URL into both the build container (for sqlx compile-time checks)
# and the runtime container. Leave url empty to disable.
database:
  url: ""  # e.g. "postgres://user:password@host:5432/dbname"
  # Optionally source DATABASE_URL from an existing secret instead of url above.
  # When existingSecret.name is set, it takes precedence over url.
  existingSecret:
    name: ""
    key: "DATABASE_URL"
  # Optionally mount a host directory containing a Postgres Unix socket into the
  # pod. The directory is mounted at the SAME path inside both the build and
  # runtime containers, so a URL like:
  #   postgres://user:pass@localhost/db?host=/path/to/socketdir
  # works unchanged. Useful on OrbStack/Docker Desktop to reach a Postgres
  # running on macOS over its Unix socket.
  socketHostPath: ""  # e.g. "/Users/you/.dev_postgres/data"
  # When true (and url or existingSecret is set), writes a `.env` file in the
  # app working directory before `cargo build` runs, containing
  # `DATABASE_URL=...`. Tools that read .env (sqlx-cli, dotenvy, etc.) will
  # pick it up. The file is on the shared app-data volume so it is also
  # visible to the runtime container.
  writeEnvFile: true

# Environment variables
env: []
  # - name: EXAMPLE_VAR
  #   value: "example_value"

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

